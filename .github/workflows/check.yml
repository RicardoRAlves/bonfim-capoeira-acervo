name: Validate historical archive
on:
  pull_request:
  push:
    branches: [research-update-2026-09]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate catalogs and verify committed output
        run: |
          python scripts/build_catalogs.py
          git diff --exit-code
      - name: Check links, records, navigation and publication constraints
        run: python scripts/check_site.py
      - name: Check JavaScript syntax
        run: |
          node --check assets/site.js
          node --check assets/interactions.js
          node --check assets/research.js
